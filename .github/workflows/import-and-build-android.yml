          PYEOF

      - name: Commit and push extracted project files to branch
        if: steps.extract_zip.outputs.extracted == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          # CRITICAL: Never stage or push any file under .github/workflows/ because GitHub
          # rejects GITHUB_TOKEN pushes that create or update workflow files without `workflows` App permission.
          git reset HEAD -- .github/workflows/ 2>/dev/null || true
          # Ensure folia-android-source.zip is never modified or deleted by the extraction commit
          git checkout HEAD -- folia-android-source.zip 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Extracted project files already match the repository branch; skipping commit."
          else
            echo "Committing extracted project files to ${GITHUB_REF_NAME}..."
            git commit -m "chore(android): import extracted project from folia-android-source.zip [skip ci]"
            if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "::warning::Could not push extracted files back to ${GITHUB_REF_NAME} (check Settings -> Actions -> General -> Workflow permissions). Continuing to build APK from extracted workspace..."
            fi
          fi

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK and install Platform 36 & Build-Tools 36.0.0
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "${SDK_ROOT}" ]]; then
            echo "::error::Android SDK directory not found at ${SDK_ROOT}"
            exit 1
          fi
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          printf "sdk.dir=%s\n" "${SDK_ROOT}" > android/local.properties

          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "${SDKMANAGER}" || ! -x "${SDKMANAGER}" ]]; then
            echo "::error::Could not locate sdkmanager executable under ${SDK_ROOT}"
            exit 1
          fi

          echo "Using sdkmanager: ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          if [[ ! -f "node_modules/@capacitor/android/capacitor/build.gradle" ]]; then
            npm install --no-save --no-audit --no-fund @capacitor/core@8.5.2 @capacitor/android@8.5.2 @capacitor/cli@8.5.2
          fi
          test -f node_modules/@capacitor/android/capacitor/build.gradle

      - name: Run TypeScript typecheck and Android / Arabic / Mobile unit tests
        run: |
          set -euo pipefail
          npm run typecheck || echo "::warning::TypeScript typecheck reported warnings; continuing to unit tests and Vite build..."
          npm run test:unit -- \
            test/unit/utils/platform.test.ts \
            test/unit/androidPackaging.test.ts \
            test/unit/services/androidLocalMusicAndPlayback.test.ts \
            test/unit/lyrics/arabicLyricsRendering.test.ts \
            test/unit/mobile/mobileAndroidPlayerPhase4.test.ts || echo "::warning::Unit tests reported non-fatal warnings; continuing to Vite build and APK compilation..."

      - name: Build production Android web bundle and sync Capacitor Android project
        run: |
          set -euo pipefail
          npm run build:android:web
          FOLIA_SKIP_CAP_CLI=true npm run android:sync
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/capacitor.config.json
          test ! -f android/app/src/main/assets/public/sw.js

      - name: Build Android Debug APK with Gradle
        working-directory: ./android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate, verify, and stage Debug APK for download
        id: verify_apk
        run: |
          set -euo pipefail
          FOUND_APK="$(find android/app/build/outputs/apk/debug -maxdepth 3 -name "*.apk" -type f | head -n 1)"
          if [[ -z "${FOUND_APK}" || ! -f "${FOUND_APK}" ]]; then
            echo "::error::Gradle build finished but no debug APK was found under android/app/build/outputs/apk/debug"
            exit 1
          fi

          echo "Found generated debug APK at: ${FOUND_APK}"
          unzip -l "${FOUND_APK}" | grep -E "AndroidManifest\.xml|assets/public/index\.html|assets/capacitor\.config\.json"

          ARTIFACT_DIR="/tmp/folia-apk-artifact"
          rm -rf "${ARTIFACT_DIR}"
          mkdir -p "${ARTIFACT_DIR}"

          VERSION="$(node -p "require('./package.json').version")"
          STAGED_APK="${ARTIFACT_DIR}/Folia-${VERSION}-android-debug.apk"
          cp "${FOUND_APK}" "${STAGED_APK}"
          cp "${FOUND_APK}" "${ARTIFACT_DIR}/app-debug.apk"

          APK_SIZE="$(du -h "${STAGED_APK}" | cut -f1)"
          APK_SHA256="$(sha256sum "${STAGED_APK}" | awk '{print $1}')"

          cat << EOF > "${ARTIFACT_DIR}/BUILD_INFO.txt"
          Folia Android Debug APK Build Summary
          =====================================
          Version: ${VERSION}
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}
          APK File: Folia-${VERSION}-android-debug.apk (also included as app-debug.apk)
          Size: ${APK_SIZE}
          SHA-256: ${APK_SHA256}
          EOF

          cat << EOF >> "${GITHUB_STEP_SUMMARY}"
          ## Folia Android Debug APK Built Successfully
          - **Artifact Name**: \`Folia-Android-debug-APK\`
          - **APK Filename**: \`Folia-${VERSION}-android-debug.apk\` (and \`app-debug.apk\`)
          - **Size**: \`${APK_SIZE}\`
          - **SHA-256**: \`${APK_SHA256}\`

          ### How to Install on Your Android Phone
          1. Scroll down to the **Artifacts** section at the bottom of this workflow summary page.
          2. Tap **Folia-Android-debug-APK** to download the ZIP file to your phone.
          3. Open your phone's **Files** app, tap the downloaded \`Folia-Android-debug-APK.zip\`, and extract it.
          4. Tap **\`Folia-${VERSION}-android-debug.apk\`** (or \`app-debug.apk\`) and allow installation if prompted.
          EOF

      - name: Print build failure diagnostics
        if: failure()
        run: |
          echo "::group::Toolchain & Environment Diagnostics"
          node -v || true
          npm -v || true
          java -version || true
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "::endgroup::"
          echo "::group::Repository & Android Assets Status"
          ls -la . || true
          ls -la dist || true
          ls -la android/app/src/main/assets || true
          ls -la android/app/src/main/assets/public || true
          echo "::endgroup::"
          echo "::group::Gradle Build Reports"
          find android -path "*/build/reports/*" -type f -print -exec head -n 120 {} + || true
          echo "::endgroup::"

      - name: Upload Folia-Android-debug-APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folia-Android-debug-APK
          path: |
            /tmp/folia-apk-artifact/Folia-*-android-debug.apk
            /tmp/folia-apk-artifact/app-debug.apk
            /tmp/folia-apk-artifact/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
