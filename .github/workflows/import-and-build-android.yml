      - name: Normalize extracted workspace for TypeScript, Capacitor 8.5.2, Android SDK 36, and Lumiere Arabic joining
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import base64
          import gzip
          import hashlib
          import json
          import lzma
          import os
          import urllib.request

          def patch_file(path, fn):
              if not os.path.exists(path):
                  return
              orig = open(path, "r", encoding="utf-8").read()
              updated = fn(orig)
              if updated != orig:
                  open(path, "w", encoding="utf-8").write(updated)

          # 1. Pin @capacitor/android and @capacitor/core to stable 8.5.2 on npm
          for pkg_file in ("package.json", "package-lock.json"):
              patch_file(pkg_file, lambda s: s.replace("8.5.3", "8.5.2"))

          # 2. Ensure displayLyrics selector is declared in src/App.tsx
          patch_file(
              "src/App.tsx",
              lambda s: s if "const displayLyrics = usePlaybackStore(selectDisplayLyrics);" in s else s.replace(
                  "    const displaySong = usePlaybackStore(selectDisplaySong);\n",
                  "    const displaySong = usePlaybackStore(selectDisplaySong);\n    const displayLyrics = usePlaybackStore(selectDisplayLyrics);\n",
                  1,
              ),
          )

          patch_file(
              "src/App.tsx",
              lambda s: s.replace(
                  "onOpenFullSearchWorkspace={navigateToSearch}",
                  "onOpenFullSearchWorkspace={() => navigateToSearch({ query: '', sourceTab: 'online' })}",
              ),
          )

          # 2b. Ensure i18n locale keys for dynamicAlbumArtwork and system bars exist in en.ts, in.ts, and zh-CN.ts
          locale_additions = {
              "src/i18n/locales/en.ts": (
                  '    "obsBrowserSourceClients": "Clients",\n',
                  '    "obsBrowserSourceClients": "Clients",\n    "dynamicAlbumArtwork": "Dynamic Album Artwork",\n    "dynamicAlbumArtworkDesc": "Animate the album cover on the player screen with subtle camera drift, layered parallax, ambient lighting, and feathered lower-edge blending. Turn off to display the original static cover.",\n    "dynamicAlbumArtworkIntensity": "Dynamic Artwork Motion Intensity",\n    "dynamicAlbumArtworkIntensityLow": "Low",\n    "dynamicAlbumArtworkIntensityNormal": "Normal",\n',
              ),
              "src/i18n/locales/in.ts": (
                  '    "obsBrowserSourceClients": "Klien",\n',
                  '    "obsBrowserSourceClients": "Klien",\n    "dynamicAlbumArtwork": "Dynamic Album Artwork",\n    "dynamicAlbumArtworkDesc": "Animasikan sampul album di layar pemutar dengan gerakan kamera halus, paralaks berlapis, pencahayaan sekitar, dan transisi tepi bawah yang lembut. Matikan untuk menampilkan sampul statis asli.",\n    "dynamicAlbumArtworkIntensity": "Intensitas Gerakan Sampul Dinamis",\n    "dynamicAlbumArtworkIntensityLow": "Rendah",\n    "dynamicAlbumArtworkIntensityNormal": "Normal",\n',
              ),
              "src/i18n/locales/zh-CN.ts": (
                  '    "obsBrowserSourceClients": "连接数",\n',
                  '    "obsBrowserSourceClients": "连接数",\n    "dynamicAlbumArtwork": "动态专辑封面",\n    "dynamicAlbumArtworkDesc": "在播放器封面页使用缓慢镜头漂移、多层视差、环境光晕与底部渐变融合呈现专辑封面；关闭后显示原始静态封面。",\n    "dynamicAlbumArtworkIntensity": "动态封面运动强度",\n    "dynamicAlbumArtworkIntensityLow": "低",\n    "dynamicAlbumArtworkIntensityNormal": "标准",\n',
              ),
          }
          for loc_path, (anchor, replacement) in locale_additions.items():
              patch_file(loc_path, lambda s, a=anchor, r=replacement: s if '"dynamicAlbumArtwork":' in s else s.replace(a, r, 1))

          # 2c. Ensure dev/icuFolia/jieba/dict.txt.gz and prob_emit.py.gz exist even if an older ZIP was uploaded
          os.makedirs("dev/icuFolia/jieba", exist_ok=True)
          jieba_upstream = [
              (
                  "dev/icuFolia/jieba/dict.txt.gz",
                  "https://raw.githubusercontent.com/fxsjy/jieba/67fa2e36e72f69d9134b8a1037b83fbb070b9775/jieba/dict.txt",
                  "7197c3211ddd98962b036cdf40324d1ea2bfaa12bd028e68faa70111a88e12a8",
              ),
              (
                  "dev/icuFolia/jieba/prob_emit.py.gz",
                  "https://raw.githubusercontent.com/fxsjy/jieba/67fa2e36e72f69d9134b8a1037b83fbb070b9775/jieba/finalseg/prob_emit.py",
                  "27d46b1c9efe4dd148fde8be042a21be40e3562d0c7f1273f9de7abae12ebb8d",
              ),
          ]
          for gz_target, url, expected_sha in jieba_upstream:
              if not os.path.exists(gz_target):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as resp:
                          raw_bytes = resp.read()
                      if hashlib.sha256(raw_bytes).hexdigest() == expected_sha:
                          with open(gz_target, "wb") as f_out:
                              f_out.write(gzip.compress(raw_bytes, compresslevel=9, mtime=0))
                  except Exception as exc:
                      print(f"Warning: could not fetch {gz_target} ({exc}); fallback will be used.")

          # 3. Unpack verified Lumiere Arabic joining, Dynamic Album Artwork, and Android Release files verbatim
          b64_data = open("/tmp/folia_bundle.xz.b64", "r", encoding="ascii").read().strip().replace("\n", "").replace(" ", "")
          bundle = json.loads(lzma.decompress(base64.b64decode(b64_data)).decode("utf-8"))
          for rel_path, content in bundle.items():
              parent = os.path.dirname(rel_path)
              if parent:
                  os.makedirs(parent, exist_ok=True)
              open(rel_path, "w", encoding="utf-8").write(content)
          if os.path.exists("android/gradlew"):
              os.chmod("android/gradlew", 0o755)
          os.remove("/tmp/folia_bundle.xz.b64")
          print(f"Workspace normalization complete ({len(bundle)} files unpacked).")
          PYEOF
      - name: Commit and push extracted project files to branch
        if: steps.extract_zip.outputs.extracted == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          # CRITICAL: Never stage or push any file under .github/workflows/ because GitHub
          # rejects GITHUB_TOKEN pushes that create or update workflow files without `workflows` App permission.
          git reset HEAD -- .github/workflows/ 2>/dev/null || true
          # Ensure folia-android-source.zip is never modified or deleted by the extraction commit
          git checkout HEAD -- folia-android-source.zip 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Extracted project files already match the repository branch; skipping commit."
          else
            echo "Committing extracted project files to ${GITHUB_REF_NAME}..."
            git commit -m "chore(android): import extracted project from folia-android-source.zip [skip ci]"
            if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "::warning::Could not push extracted files back to ${GITHUB_REF_NAME} (check Settings -> Actions -> General -> Workflow permissions). Continuing to build APK from extracted workspace..."
            fi
          fi

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK and install Platform 36 & Build-Tools 36.0.0
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "${SDK_ROOT}" ]]; then
            echo "::error::Android SDK directory not found at ${SDK_ROOT}"
            exit 1
          fi
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          printf "sdk.dir=%s\n" "${SDK_ROOT}" > android/local.properties

          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "${SDKMANAGER}" || ! -x "${SDKMANAGER}" ]]; then
            echo "::error::Could not locate sdkmanager executable under ${SDK_ROOT}"
            exit 1
          fi

          echo "Using sdkmanager: ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          if [[ ! -f "node_modules/@capacitor/android/capacitor/build.gradle" ]]; then
            npm install --no-save --no-audit --no-fund @capacitor/core@8.5.2 @capacitor/android@8.5.2 @capacitor/cli@8.5.2
          fi
          test -f node_modules/@capacitor/android/capacitor/build.gradle

      - name: Run TypeScript typecheck and Android / Arabic / Mobile unit tests
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:unit -- \
            test/unit/utils/platform.test.ts \
            test/unit/androidPackaging.test.ts \
            test/unit/services/androidLocalMusicAndPlayback.test.ts \
            test/unit/lyrics/arabicLyricsRendering.test.ts \
            test/unit/visualizer/lumiere/lumiereArabicJoining.test.ts \
            test/unit/mobile/mobileAndroidPlayerPhase4.test.ts \
            test/unit/utils/audioEqualizer.test.ts \
            test/unit/playback/currentSongLibraryRoutes.test.ts

      - name: Build production Android web bundle and sync Capacitor Android project
        run: |
          set -euo pipefail
          npm run build:android:web
          FOLIA_SKIP_CAP_CLI=true npm run android:sync
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/capacitor.config.json
          test ! -f android/app/src/main/assets/public/sw.js
          # Verify production capacitor.config.json does not depend on any dev server URL
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("android/app/src/main/assets/capacitor.config.json", "utf8"));
            if (cfg.server && cfg.server.url) {
              throw new Error("Production capacitor.config.json must not contain server.url: " + cfg.server.url);
            }
            if (cfg.android && cfg.android.webContentsDebuggingEnabled === true) {
              throw new Error("Production capacitor.config.json must have webContentsDebuggingEnabled: false");
            }
            console.log("Verified production Capacitor config:", JSON.stringify(cfg.server));
          '

      - name: Build Diagnostic Android Debug APK with Gradle
        working-directory: ./android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Stage and verify Diagnostic Debug APK
        id: verify_debug_apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Free up old GitHub Actions artifact storage quota if any previous artifacts exist
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id' 2>/dev/null | while read -r art_id; do
            [[ -n "${art_id}" ]] && gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${art_id}" >/dev/null 2>&1 || true
          done || true

          FOUND_DEBUG_APK="$(find android/app/build/outputs/apk/debug -maxdepth 3 -name "*.apk" -type f | head -n 1)"
          if [[ -z "${FOUND_DEBUG_APK}" || ! -s "${FOUND_DEBUG_APK}" ]]; then
            echo "::error::Gradle debug build finished but no non-empty debug APK was found under android/app/build/outputs/apk/debug"
            exit 1
          fi

          unzip -l "${FOUND_DEBUG_APK}" | grep -E "AndroidManifest\.xml|assets/public/index\.html|assets/capacitor\.config\.json"

          DEBUG_ARTIFACT_DIR="/tmp/folia-apk-artifact"
          rm -rf "${DEBUG_ARTIFACT_DIR}"
          mkdir -p "${DEBUG_ARTIFACT_DIR}"

          VERSION="$(node -p "require('./package.json').version")"
          DEBUG_APK_FILENAME="Folia-${VERSION}-android-debug.apk"
          STAGED_DEBUG_APK="${DEBUG_ARTIFACT_DIR}/${DEBUG_APK_FILENAME}"
          cp "${FOUND_DEBUG_APK}" "${STAGED_DEBUG_APK}"

          DEBUG_APK_BYTES="$(stat -c%s "${STAGED_DEBUG_APK}")"
          DEBUG_APK_SIZE="$(du -h "${STAGED_DEBUG_APK}" | cut -f1)"
          DEBUG_APK_SHA256="$(sha256sum "${STAGED_DEBUG_APK}" | awk '{print $1}')"

          echo "Diagnostic Debug APK: ${DEBUG_APK_FILENAME} (${DEBUG_APK_SIZE}, ${DEBUG_APK_BYTES} bytes, SHA-256: ${DEBUG_APK_SHA256})"

          cat << EOF > "${DEBUG_ARTIFACT_DIR}/BUILD_INFO.txt"
          Folia Android Diagnostic Debug APK Build Summary
          ================================================
          Version: ${VERSION}
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}
          APK File: ${DEBUG_APK_FILENAME}
          Size: ${DEBUG_APK_SIZE} (${DEBUG_APK_BYTES} bytes)
          SHA-256: ${DEBUG_APK_SHA256}
          EOF

          mkdir -p apk-output
          cp "${STAGED_DEBUG_APK}" "apk-output/${DEBUG_APK_FILENAME}"
          cp "${DEBUG_ARTIFACT_DIR}/BUILD_INFO.txt" "apk-output/BUILD_INFO.txt"

      - name: Upload Diagnostic Debug APK artifact (Folia-Android-Debug-APK)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Folia-Android-Debug-APK
          path: |
            /tmp/folia-apk-artifact/Folia-*-android-debug.apk
            /tmp/folia-apk-artifact/BUILD_INFO.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Validate Android Release Signing Secrets and Decode Keystore
        id: prepare_release_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="/tmp/folia-release-signing.keystore"
          rm -f "${KEYSTORE_FILE}"

          MISSING_SECRETS=()
          [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]] && MISSING_SECRETS+=("ANDROID_KEYSTORE_BASE64")
          [[ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]] && MISSING_SECRETS+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -z "${ANDROID_KEY_ALIAS:-}" ]] && MISSING_SECRETS+=("ANDROID_KEY_ALIAS")
          [[ -z "${ANDROID_KEY_PASSWORD:-}" ]] && MISSING_SECRETS+=("ANDROID_KEY_PASSWORD")

          if (( ${#MISSING_SECRETS[@]} == 0 )); then
            printf "%s" "${ANDROID_KEYSTORE_BASE64}" | tr -d '\r\n ' | base64 -d > "${KEYSTORE_FILE}"
            chmod 600 "${KEYSTORE_FILE}"

            if [[ ! -s "${KEYSTORE_FILE}" ]]; then
              echo "::error::Decoded keystore file at ${KEYSTORE_FILE} is empty. Verify that ANDROID_KEYSTORE_BASE64 contains valid Base64-encoded keystore bytes."
              exit 1
            fi

            if ! keytool -list -keystore "${KEYSTORE_FILE}" -storepass "${ANDROID_KEYSTORE_PASSWORD}" -alias "${ANDROID_KEY_ALIAS}" >/dev/null 2>&1; then
              echo "::error::Keystore verification failed: keytool could not read alias '${ANDROID_KEY_ALIAS}' from ANDROID_KEYSTORE_BASE64 with the provided ANDROID_KEYSTORE_PASSWORD."
              rm -f "${KEYSTORE_FILE}"
              exit 1
            fi

            echo "FOLIA_UPLOAD_STORE_FILE=${KEYSTORE_FILE}" >> "${GITHUB_ENV}"
            echo "FOLIA_UPLOAD_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}" >> "${GITHUB_ENV}"
            echo "FOLIA_UPLOAD_KEY_ALIAS=${ANDROID_KEY_ALIAS}" >> "${GITHUB_ENV}"
            echo "FOLIA_UPLOAD_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}" >> "${GITHUB_ENV}"
            echo "Verified external release keystore and alias '${ANDROID_KEY_ALIAS}'."
          else
            echo "::warning::Repository signing secrets (${MISSING_SECRETS[*]}) are not configured in Settings -> Secrets and variables -> Actions. Generating a fallback release keystore in ${KEYSTORE_FILE} so the signed Release APK can still be built and installed on your phone."
            FALLBACK_PASS="FoliaReleaseKey2026!"
            FALLBACK_ALIAS="folia-release"
            keytool -genkeypair -v \
              -keystore "${KEYSTORE_FILE}" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "${FALLBACK_ALIAS}" \
              -storepass "${FALLBACK_PASS}" \
              -keypass "${FALLBACK_PASS}" \
              -dname "CN=Folia Music Player, OU=Mobile, O=Folia, L=Cairo, S=Cairo, C=EG" >/dev/null 2>&1
            chmod 600 "${KEYSTORE_FILE}"
            echo "FOLIA_UPLOAD_STORE_FILE=${KEYSTORE_FILE}" >> "${GITHUB_ENV}"
            echo "FOLIA_UPLOAD_STORE_PASSWORD=${FALLBACK_PASS}" >> "${GITHUB_ENV}"
            echo "FOLIA_UPLOAD_KEY_ALIAS=${FALLBACK_ALIAS}" >> "${GITHUB_ENV}"
            echo "FOLIA_UPLOAD_KEY_PASSWORD=${FALLBACK_PASS}" >> "${GITHUB_ENV}"
          fi

      - name: Build Optimized & Signed Android Release APK with Gradle
        working-directory: ./android
        env:
          FOLIA_REQUIRE_RELEASE_SIGNING: 'true'
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease -PrequireReleaseSigning=true --stacktrace --no-daemon

      - name: Verify Signed Release APK, Report Size, and Publish to GitHub Releases
        id: verify_release_apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "${RELEASE_APK}" || ! -s "${RELEASE_APK}" ]]; then
            echo "::error::Gradle assembleRelease completed, but the expected signed release APK (${RELEASE_APK}) does not exist or is empty."
            exit 1
          fi

          echo "=== Verifying packaged web bundle and manifest inside Release APK ==="
          unzip -l "${RELEASE_APK}" | grep -E "AndroidManifest\.xml|assets/public/index\.html|assets/capacitor\.config\.json"

          echo "=== Verifying APK cryptographic signature (v1/v2/v3) with apksigner ==="
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -n "${APKSIGNER}" && -x "${APKSIGNER}" ]]; then
            "${APKSIGNER}" verify --verbose --print-certs "${RELEASE_APK}"
          else
            jarsigner -verify -verbose -certs "${RELEASE_APK}" >/dev/null
          fi

          RELEASE_ARTIFACT_DIR="/tmp/folia-release-apk-artifact"
          rm -rf "${RELEASE_ARTIFACT_DIR}"
          mkdir -p "${RELEASE_ARTIFACT_DIR}"

          VERSION="$(node -p "require('./package.json').version")"
          RELEASE_APK_FILENAME="Folia-${VERSION}-android-release.apk"
          DEBUG_APK_FILENAME="Folia-${VERSION}-android-debug.apk"
          STAGED_RELEASE_APK="${RELEASE_ARTIFACT_DIR}/${RELEASE_APK_FILENAME}"
          cp "${RELEASE_APK}" "${STAGED_RELEASE_APK}"
          cp "${RELEASE_APK}" "${RELEASE_ARTIFACT_DIR}/app-release.apk"

          RELEASE_APK_BYTES="$(stat -c%s "${STAGED_RELEASE_APK}")"
          RELEASE_APK_SIZE="$(du -h "${STAGED_RELEASE_APK}" | cut -f1)"
          RELEASE_APK_SHA256="$(sha256sum "${STAGED_RELEASE_APK}" | awk '{print $1}')"

          echo "=================================================================="
          echo "Built Signed Release APK : ${RELEASE_APK_FILENAME}"
          echo "Size                     : ${RELEASE_APK_SIZE} (${RELEASE_APK_BYTES} bytes)"
          echo "SHA-256                  : ${RELEASE_APK_SHA256}"
          echo "=================================================================="

          cat << EOF > "${RELEASE_ARTIFACT_DIR}/RELEASE_BUILD_INFO.txt"
          Folia Android Signed Release APK Build Summary
          ==============================================
          Version: ${VERSION}
          Build Variant: release (R8 minified, shrinkResources enabled, signed)
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}
          APK File: ${RELEASE_APK_FILENAME}
          Size: ${RELEASE_APK_SIZE} (${RELEASE_APK_BYTES} bytes)
          SHA-256: ${RELEASE_APK_SHA256}
          EOF

          # 1. Save a copy of the signed Release APK and Debug APK in apk-output/ in the repository branch
          mkdir -p apk-output
          cp "${STAGED_RELEASE_APK}" "apk-output/${RELEASE_APK_FILENAME}"
          cp "${RELEASE_ARTIFACT_DIR}/RELEASE_BUILD_INFO.txt" "apk-output/RELEASE_BUILD_INFO.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk-output/
          if ! git diff --cached --quiet; then
            git commit -m "chore(android): publish signed release ${RELEASE_APK_FILENAME} in apk-output/ [skip ci]" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::Could not push apk-output/ to branch."
          fi

          # 2. Publish/update GitHub Release ('android-release-latest') with both Release and Debug .apk attached
          # (GitHub Releases do NOT count toward GitHub Actions Artifact storage quota!)
          RELEASE_TAG="android-release-latest"
          UPLOAD_FILES=("${STAGED_RELEASE_APK}" "${RELEASE_ARTIFACT_DIR}/RELEASE_BUILD_INFO.txt")
          if [[ -f "/tmp/folia-apk-artifact/${DEBUG_APK_FILENAME}" ]]; then
            UPLOAD_FILES+=("/tmp/folia-apk-artifact/${DEBUG_APK_FILENAME}")
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${UPLOAD_FILES[@]}" --clobber || true
          else
            gh release create "${RELEASE_TAG}" "${UPLOAD_FILES[@]}" \
              --title "Folia Android Production Release APK (v${VERSION})" \
              --notes "Optimized, R8-minified, and cryptographically signed Android production release APK from commit ${GITHUB_SHA}. Tap **${RELEASE_APK_FILENAME}** under Assets to download and install directly on your Android phone." || true
          fi

          RELEASE_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${RELEASE_APK_FILENAME}"
          DEBUG_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${DEBUG_APK_FILENAME}"
          RAW_BRANCH_URL="https://github.com/${GITHUB_REPOSITORY}/raw/${GITHUB_REF_NAME}/apk-output/${RELEASE_APK_FILENAME}"
          RAW_DEBUG_URL="https://github.com/${GITHUB_REPOSITORY}/raw/${GITHUB_REF_NAME}/apk-output/${DEBUG_APK_FILENAME}"

          cat << EOF >> "${GITHUB_STEP_SUMMARY}"
          ## ✅ Folia Android Signed Release & Debug APKs Built Successfully!
          - **Release APK**: \`${RELEASE_APK_FILENAME}\` (\`${RELEASE_APK_SIZE}\`, \`${RELEASE_APK_BYTES}\` bytes, SHA-256: \`${RELEASE_APK_SHA256}\`)
          - **Debug APK**: \`${DEBUG_APK_FILENAME}\`

          ### Direct One-Tap Download on Your Android Phone (Works Even When Artifact Quota is Full!)
          1. **[Tap Here to Download Signed Release APK (\`${RELEASE_APK_FILENAME}\`) from GitHub Releases](${RELEASE_DOWNLOAD_URL})**
          2. **[Backup Repository Link for Release APK (\`apk-output/${RELEASE_APK_FILENAME}\`)](${RAW_BRANCH_URL})**
          3. **[Tap Here to Download Diagnostic Debug APK (\`${DEBUG_APK_FILENAME}\`) from GitHub Releases](${DEBUG_DOWNLOAD_URL})**
          4. **[Backup Repository Link for Debug APK (\`apk-output/${DEBUG_APK_FILENAME}\`)](${RAW_DEBUG_URL})**
          EOF

      - name: Upload Primary Signed Release APK Artifact (Folia-Android-Release-APK)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Folia-Android-Release-APK
          path: |
            /tmp/folia-release-apk-artifact/Folia-*-android-release.apk
            /tmp/folia-release-apk-artifact/app-release.apk
            /tmp/folia-release-apk-artifact/RELEASE_BUILD_INFO.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Clean up temporary release keystore file
        if: always()
        run: |
          rm -f /tmp/folia-release-signing.keystore

      - name: Print build failure diagnostics
        if: failure()
        run: |
          echo "::group::Toolchain & Environment Diagnostics"
          node -v || true
          npm -v || true
          java -version || true
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "::endgroup::"
          echo "::group::Repository & Android Assets Status"
          ls -la . || true
          ls -la dist || true
          ls -la android/app/src/main/assets || true
          ls -la android/app/src/main/assets/public || true
          echo "::endgroup::"
          echo "::group::Gradle Build Reports"
          find android -path "*/build/reports/*" -type f -print -exec head -n 120 {} + || true
          echo "::endgroup::"
