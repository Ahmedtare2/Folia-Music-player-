name: Deploy Web App (iPhone home-screen install)

# Builds the web version of Folia and publishes it on GitHub Pages over HTTPS from the gh-pages branch (no workflow artifact, so the artifact storage quota is not used). On an iPhone, open the page in Safari,
# tap Share, then "Add to Home Screen" (Folia opens full screen like an app). Turn Pages on once:
# after the first run: Settings -> Pages -> Build and deployment -> Source: Deploy from a branch -> Branch: gh-pages, folder / (root).
# It runs by itself after the Android workflow finishes and can also be run by hand.

on:
  workflow_run:
    workflows: ['Import Source ZIP and Build Android Release & Debug APKs']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply the latest source overrides from the ZIP
        run: node packaging/android/restore-latest-overrides.mjs

      - name: Show which source this build uses
        run: |
          git log -1 --format='main commit: %H %cI %s'
          for f in src/utils/webBuildTag.ts src/services/webOpfsImport.ts; do
            if [ -f "$f" ]; then echo "present: $f"; else echo "MISSING: $f"; fi
          done
          grep -c "installWebBuildTag" src/index.tsx || true
          grep -n "showDirectoryPicker" src/services/localLibraryAvailability.ts || true

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build the web app for the Pages sub-path
        env:
          FOLIA_WEB_BASE: /${{ github.event.repository.name }}/
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npx vite build
          # A reload of a deep link must still open the app.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          # Proof of what was published: open <site>/build-info.json in Safari.
          TAGGED=no
          if grep -rl "folia-web-build-tag" dist/assets >/dev/null 2>&1; then TAGGED=yes; fi
          echo "build tag code in the bundle: $TAGGED"
          printf '{"commit":"%s","builtAt":"%s","webBuildTagInBundle":"%s"}\n' "$(git rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$TAGGED" > dist/build-info.json
          cat dist/build-info.json

      - name: Publish the build to the gh-pages branch
        run: |
          cd dist
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy web build"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
